name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_repo.py
      - run: python3 scripts/check_docs.py
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install ruff==0.16.5
      - run: ruff check plugins tests scripts
      - run: python3 scripts/check_sensitive_data.py --index --fail-on-findings
      - run: python3 scripts/check_sensitive_data.py --history --fail-on-findings
  mobile-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: python3 scripts/generate_examples.py
      - run: node scripts/check_mobile_card.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-card-browser-evidence
          path: work/mobile-card/
